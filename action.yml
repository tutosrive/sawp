name: 'SWP-action'
description: '"Stargazers Action With Postgres", get all user starred repositories and save it on Postgres Relational Database'
branding:
  icon: 'database'
  color: '#150029'
inputs:
  github-user:
    description: 'Github Username used as reference to get all it starred repositories'
    required: true
    default: ''
  github-token:
    description: 'Acces Token for the github API'
    required: true
    default: ''
  db-connection-url:
    description: 'Postgres connection string (e.g. "postgresql://postgres...")'
    required: true
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
